<text x="602" y="2002" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">OnDidNavigate</text>
<rect x="582" y="2039" width="386" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="598" y="2066" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">locker.Dispose()</text>
