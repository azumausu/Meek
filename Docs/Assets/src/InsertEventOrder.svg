<text x="598" y="449" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">IInputLocker.LockInput()</text>
<text x="598" y="477" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">blocks input for the whole navigation</text>
