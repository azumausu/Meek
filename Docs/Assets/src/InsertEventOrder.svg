<text x="602" y="538" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">OnWillNavigate</text>
<text x="602" y="570" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">StackNavigationService global hook</text>
<rect x="988" y="597" width="532" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="1004" y="624" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">Initialize()</text>
<text x="1004" y="652" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">resolves AppServices / ScreenUI</text>
<rect x="988" y="678" width="532" height="81" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="1008" y="713" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">GetNextScreenParameter&lt;TParam&gt;()</text>
<text x="1008" y="745" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">MVPScreen&lt;TModel, TParam&gt; only</text>
<rect x="988" y="772" width="532" height="87" rx="14" fill="#1F6FEB" stroke="#4A90F5" stroke-width="0"/>
<text x="1008" y="812" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">CreateModelAsync()</text>
<text x="1008" y="849" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#CBDEFF">you implement this</text>
<rect x="988" y="872" width="532" height="84" rx="14" fill="#1F6FEB" stroke="#4A90F5" stroke-width="0"/>
<text x="1008" y="909" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="24" font-weight="700" fill="#FFFFFF">RegisterEvents(eventHolder, model)</text>
<text x="1008" y="943" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#CBDEFF">you implement this</text>
<rect x="988" y="969" width="532" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="1004" y="996" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">UI.LockInteractable()</text>
<text x="1004" y="1024" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">released later, once X becomes the top screen</text>
<rect x="988" y="1050" width="532" height="87" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="1008" y="1090" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenWillStart</text>
<text x="1008" y="1127" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#C7EEDA">await LoadPresenterAsync&lt;T&gt;() here</text>
<rect x="1375" y="1064" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1437.5" y="1082" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="988" y="1150" width="532" height="102" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="1008" y="1185" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">UI.Setup()</text>
<text x="1008" y="1217" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">evaluates the Open animation at t = 0, then</text>
<text x="1008" y="1238" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">Presenter.OnSetup(model) → Bind(model)</text>
<rect x="988" y="1265" width="532" height="82" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="1008" y="1316.5" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenDidPause</text>
<rect x="1375" y="1279" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1437.5" y="1297" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="86" y="1360" width="1434" height="58" rx="14" fill="#38301F" stroke="#7E6526" stroke-width="1"/>
<text x="106" y="1395.5" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E9B84A">★</text>
<text x="136" y="1395.5" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="19" fill="#E9B84A">ScreenWillPause never fires on Insert. The order is ScreenWillStart → ScreenDidPause → ScreenDidStart.</text>
<rect x="582" y="1431" width="386" height="88" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="598" y="1458" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">ScreenContainer.NavigateAsync()</text>
<text x="598" y="1486" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">splices X in below Screen C, then</text>
<text x="598" y="1506" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">SortOrderInHierarchy()</text>
<rect x="86" y="1532" width="476" height="64" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="106" y="1572" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">ViewWillOpen</text>
<rect x="417" y="1546" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="479.5" y="1564" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="86" y="1609" width="1434" height="58" rx="14" fill="#38301F" stroke="#7E6526" stroke-width="1"/>
<text x="106" y="1644.5" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E9B84A">★</text>
<text x="136" y="1644.5" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="19" fill="#E9B84A">The View events fire on the top screen C — not on the inserted screen X.</text>
<rect x="582" y="1680" width="386" height="97" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="602" y="1710" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="17" font-weight="500" fill="#EDE7FF">InsertNavigatorAnimationStrategy</text>
<text x="602" y="1737" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">visibility fix-up only — no animation</text>
<text x="602" y="1758" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">is played</text>
<rect x="86" y="1790" width="476" height="64" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="106" y="1830" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">ViewDidOpen</text>
<rect x="417" y="1804" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="479.5" y="1822" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="988" y="1867" width="532" height="82" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="1008" y="1918.5" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenDidStart</text>
<rect x="1441" y="1881" width="59" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1470.5" y="1899" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync</text>
