<text x="1044" y="210" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#727B87">sync — Action handlers only</text>
<text x="1044" y="232" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#727B87">sync → async — every Action handler runs, then each</text>
<text x="1044" y="254" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#727B87">Func&lt;Task&gt; handler is awaited in registration order</text>
