<line x1="1044" y1="186" x2="1494" y2="186" stroke="#343941"/>
<text x="1044" y="210" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#727B87">sync — Action handlers only</text>
<text x="1044" y="232" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#727B87">sync → async — every Action handler runs, then each</text>
<text x="1044" y="254" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#727B87">Func&lt;Task&gt; handler is awaited in registration order</text>
<text x="86" y="332" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8B95A3">Screen A</text>
<text x="86" y="356" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#5E6773">the screen being covered</text>
<text x="582" y="332" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8B95A3">Meek core</text>
<text x="582" y="356" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#5E6773">navigator / service</text>
<text x="988" y="332" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8B95A3">Screen B</text>
<text x="988" y="356" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#5E6773">the screen being pushed</text>
