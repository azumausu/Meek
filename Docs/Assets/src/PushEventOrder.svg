<text x="46" y="70" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#F2F5F8">Push — event order</text>
<text x="46" y="106" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="20" fill="#8B95A3">PushNavigation.PushAsync&lt;ScreenB&gt;()  ·  Screen A → Screen B</text>
