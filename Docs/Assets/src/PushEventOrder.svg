<rect x="582" y="422" width="386" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="598" y="449" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">IInputLocker.LockInput()</text>
<text x="598" y="477" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">blocks input for the whole navigation</text>
<rect x="582" y="503" width="386" height="81" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="602" y="538" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">OnWillNavigate</text>
<text x="602" y="570" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">StackNavigationService global hook</text>
<rect x="86" y="597" width="476" height="82" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="106" y="648.5" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenWillPause</text>
<rect x="483" y="611" width="59" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="512.5" y="629" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync</text>
<rect x="86" y="692" width="476" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="102" y="719" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">UI.LockInteractable()</text>
<text x="102" y="747" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">Screen A stays locked until a Pop resumes it</text>
<rect x="988" y="773" width="532" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="1004" y="800" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">Initialize()</text>
<text x="1004" y="828" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">resolves AppServices / ScreenUI</text>
<rect x="86" y="854" width="476" height="82" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="106" y="905.5" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenDidPause</text>
<rect x="417" y="868" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="479.5" y="886" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="86" y="949" width="1434" height="58" rx="14" fill="#38301F" stroke="#7E6526" stroke-width="1"/>
<text x="106" y="984.5" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E9B84A">★</text>
<text x="136" y="984.5" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="19" fill="#E9B84A">Screen A's ScreenDidPause fires before Screen B's CreateModelAsync().</text>
<rect x="988" y="1020" width="532" height="81" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="1008" y="1055" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">GetNextScreenParameter&lt;TParam&gt;()</text>
<text x="1008" y="1087" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">MVPScreen&lt;TModel, TParam&gt; only</text>
<rect x="988" y="1114" width="532" height="109" rx="14" fill="#1F6FEB" stroke="#4A90F5" stroke-width="0"/>
<text x="1008" y="1154" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">CreateModelAsync()</text>
<text x="1008" y="1191" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#CBDEFF">you implement this · the returned Model is disposed</text>
<text x="1008" y="1213" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#CBDEFF">with the screen</text>
<rect x="988" y="1236" width="532" height="106" rx="14" fill="#1F6FEB" stroke="#4A90F5" stroke-width="0"/>
<text x="1008" y="1273" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="24" font-weight="700" fill="#FFFFFF">RegisterEvents(eventHolder, model)</text>
<text x="1008" y="1307" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#CBDEFF">you implement this · every handler below is</text>
<text x="1008" y="1329" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#CBDEFF">registered here</text>
<rect x="988" y="1355" width="532" height="46" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="1004" y="1384" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">UI.LockInteractable()</text>
<rect x="988" y="1414" width="532" height="109" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="1008" y="1454" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenWillStart</text>
<text x="1008" y="1491" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#C7EEDA">await LoadPresenterAsync&lt;T&gt;() here → instantiates</text>
<text x="1008" y="1513" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="17" fill="#C7EEDA">the prefab, Presenter.OnInit, LoadAsync(model)</text>
<rect x="1375" y="1428" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1437.5" y="1446" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="988" y="1536" width="532" height="102" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="1008" y="1571" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">UI.Setup()</text>
<text x="1008" y="1603" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">evaluates the Open animation at t = 0, then</text>
<text x="1008" y="1624" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">Presenter.OnSetup(model) → Bind(model)</text>
<rect x="582" y="1651" width="386" height="88" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="598" y="1678" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">ScreenContainer.NavigateAsync()</text>
<text x="598" y="1706" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">pushes B onto the stack, then</text>
<text x="598" y="1726" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">SortOrderInHierarchy()</text>
<rect x="988" y="1752" width="532" height="64" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="1008" y="1792" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">ViewWillOpen</text>
<rect x="1375" y="1766" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1437.5" y="1784" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="582" y="1829" width="386" height="102" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="602" y="1864" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">Transition animation</text>
<text x="602" y="1896" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">A: Hide → B: Open · parallel when</text>
<text x="602" y="1917" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="16" fill="#B7ACD9">IsCrossFade</text>
<rect x="988" y="1944" width="532" height="64" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="1008" y="1984" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">ViewDidOpen</text>
<rect x="1375" y="1958" width="125" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1437.5" y="1976" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync → async</text>
<rect x="988" y="2021" width="532" height="46" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="1004" y="2050" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">interactableLock.Dispose()</text>
<rect x="988" y="2080" width="532" height="82" rx="14" fill="#1E9C63" stroke="#3FC286" stroke-width="0"/>
<text x="1008" y="2131.5" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="27" font-weight="700" fill="#FFFFFF">ScreenDidStart</text>
<rect x="1441" y="2094" width="59" height="26" rx="13" fill="rgba(0,0,0,0.26)"/><text x="1470.5" y="2112" text-anchor="middle" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="rgba(255,255,255,0.8)">sync</text>
<rect x="582" y="2175" width="386" height="64" rx="12" fill="#584A8C" stroke="#7A69B8" stroke-width="0"/>
<text x="602" y="2215" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="22" font-weight="500" fill="#EDE7FF">OnDidNavigate</text>
<rect x="582" y="2252" width="386" height="68" rx="9" fill="#2C3037" stroke="#3C424B" stroke-width="1"/>
<text x="598" y="2279" font-family="Menlo, "SF Mono", "DejaVu Sans Mono", monospace" font-size="18" font-weight="500" fill="#7E8794">locker.Dispose()</text>
<text x="598" y="2307" font-family=""Helvetica Neue", Helvetica, Arial, sans-serif" font-size="15" fill="#666E7A">input unlocked</text>

